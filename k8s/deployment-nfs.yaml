apiVersion: v1
kind: Namespace
metadata:
  name: pullbackup
---
# NFS PersistentVolume for backups
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pullbackup-backups-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 172.20.0.25
    path: /backup
  mountOptions:
    - nfsvers=4.1
    - hard
    - intr
---
# PVC for NFS backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pullbackup-backups
  namespace: pullbackup
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: pullbackup-backups-nfs
  storageClassName: ""
---
# Local PVC for database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pullbackup-data
  namespace: pullbackup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: pullbackup-secrets
  namespace: pullbackup
type: Opaque
stringData:
  SECRET_KEY: "change-this-to-a-random-secret-key-in-production"
  DATABASE_URL: "sqlite:///./data/pullbackup.db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullbackup-backend
  namespace: pullbackup
  labels:
    app: pullbackup
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pullbackup
      component: backend
  template:
    metadata:
      labels:
        app: pullbackup
        component: backend
    spec:
      containers:
      - name: backend
        image: pullbackup-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pullbackup-secrets
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pullbackup-secrets
              key: SECRET_KEY
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "30"
        - name: BACKUP_ROOT_DIR
          value: "/backups"
        - name: SSH_KEYS_DIR
          value: "/app/ssh_keys"
        - name: MAX_PARALLEL_BACKUPS
          value: "3"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: backups
          mountPath: /backups
        - name: ssh-keys
          mountPath: /app/ssh_keys
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pullbackup-data
      - name: backups
        persistentVolumeClaim:
          claimName: pullbackup-backups
      - name: ssh-keys
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: pullbackup-backend
  namespace: pullbackup
spec:
  selector:
    app: pullbackup
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullbackup-frontend
  namespace: pullbackup
  labels:
    app: pullbackup
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pullbackup
      component: frontend
  template:
    metadata:
      labels:
        app: pullbackup
        component: frontend
    spec:
      containers:
      - name: frontend
        image: pullbackup-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: pullbackup-frontend
  namespace: pullbackup
spec:
  selector:
    app: pullbackup
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pullbackup-ingress
  namespace: pullbackup
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: pullbackup.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pullbackup-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pullbackup-backend
            port:
              number: 8000
