apiVersion: v1
kind: Namespace
metadata:
  name: pullbackup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pullbackup-data
  namespace: pullbackup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pullbackup-backups
  namespace: pullbackup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: pullbackup-secrets
  namespace: pullbackup
type: Opaque
stringData:
  SECRET_KEY: "change-this-to-a-random-secret-key-in-production"
  DATABASE_URL: "sqlite:///./data/pullbackup.db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pullbackup
  namespace: pullbackup
  labels:
    app: pullbackup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pullbackup
  template:
    metadata:
      labels:
        app: pullbackup
    spec:
      containers:
      - name: pullbackup
        image: pullbackup:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pullbackup-secrets
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pullbackup-secrets
              key: SECRET_KEY
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "30"
        - name: BACKUP_ROOT_DIR
          value: "/backups"
        - name: SSH_KEYS_DIR
          value: "/app/data/ssh_keys"
        - name: MAX_PARALLEL_BACKUPS
          value: "3"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: backups
          mountPath: /backups
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pullbackup-data
      - name: backups
        persistentVolumeClaim:
          claimName: pullbackup-backups
---
apiVersion: v1
kind: Service
metadata:
  name: pullbackup
  namespace: pullbackup
spec:
  selector:
    app: pullbackup
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pullbackup-ingress
  namespace: pullbackup
spec:
  rules:
  - host: pullbackup.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pullbackup
            port:
              number: 80
