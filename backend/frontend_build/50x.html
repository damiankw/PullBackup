<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - PullBackup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(239, 68, 68, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .logo {
            background: #ef4444;
            border-radius: 24px;
            padding: 24px;
            display: inline-flex;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
        }

        .logo svg {
            width: 64px;
            height: 64px;
            fill: white;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #ef4444;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 2rem;
        }

        .message-box {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .message-box p {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .message-box p:last-child {
            margin-bottom: 0;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
            margin-top: 1.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }

        .status-text {
            color: #f87171;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .action-button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 12px 32px;
            background: #14b8a6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        .action-button:hover {
            background: #0d9488;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.4);
        }

        .footer {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 2rem;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .message-box {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <h1>Server Error</h1>
        <div class="subtitle">PullBackup</div>

        <div class="message-box">
            <p>Oops! Something unexpected happened on our end.</p>
            <p>Our team has been notified and is working to resolve the issue. Your backup data remains safe and secure.</p>
            
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Error Detected</span>
            </div>

            <a href="/" class="action-button">Return to Dashboard</a>
        </div>

        <div class="footer">
            If the problem persists, please contact your system administrator.
        </div>
    </div>
</body>
</html>
